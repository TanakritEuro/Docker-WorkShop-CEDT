services:
  web:
    # step-5a: build the image from the local Dockerfile and expose port 3000.
    build: .
    ports:
      - "3000:3000"

    # step-5b: DATABASE_URL so the app can reach Postgres (host = service name `db`).
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/workshop

    # step-5c: wait until `db` is healthy before starting.
    depends_on:
      db:
        condition: service_healthy

  db:
    # step-5d: postgres:16-alpine with a pg_isready healthcheck.
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workshop"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

    # step-5e + step-5g: named volume for data, plus the seed script (read-only).
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    # step-5f: Postgres env vars so the DB and user are created on startup.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workshop

# step-5h: top-level named volume.
volumes:
  pgdata:
